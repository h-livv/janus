experiment:
  name: dipole_level1
  level: 1
  case: dipole
  output_dir: transport/validation/outputs

particle_source:
  type: geant4
  species: antiproton
  charge_filter: antiproton
  n_particles: 1

lattice:
  z_start: 0.0
  elements:
    - {type: dipole, length: 1000.0, by: 0.5, aperture: 100.0}

numerical:
  dt: 1.0e-10
  max_steps: 500
  max_steps_conv: 150
  convergence: {enabled: true, mode: analytical, num_points: 8, refinement_ratio: 2.0}
  solver: boris

validation:
  pass_criteria: all_must_pass

outputs: {report: true, json: true, csv: true, manifest: true, plots: true, visualization: false}
