experiment:
  name: drift_level1
  level: 1
  case: drift
  output_dir: transport/validation/outputs

particle_source:
  type: geant4
  species: proton
  charge_filter: any
  n_particles: 1

lattice:
  z_start: 0.0
  elements:
    - {type: drift, length: 100.0, aperture: 100.0}

numerical:
  dt: 1.0e-10
  max_steps: 500
  max_steps_conv: 300
  convergence: {enabled: true, mode: analytical, num_points: 8, refinement_ratio: 2.0}
  solver: boris

validation:
  pass_criteria: all_must_pass

outputs: {report: true, json: true, csv: true, manifest: true, plots: true, visualization: false}
